---
layout: default
title: Status
permalink: /status/
---
<div class="card list">
{% for task in site.data.status.tasks %}
{% assign state_class = task.state | slugify %}
<div class="row">
<span class="n">0{{ forloop.index }}</span>
<h3>{{ task.name }}{% if task.note %}<span class="sub">{{ task.note }}</span>{% endif %}</h3>
<span class="tag {{ state_class }}">{{ task.state }}</span>
</div>
{% endfor %}
</div>
