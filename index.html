---
layout: default
---
<div class="card list">
{% for post in site.posts %}
<a class="row" href="{{ post.url | relative_url }}">
<span class="n">0{{ forloop.index }}</span>
<span class="d">{{ post.date | date: "%b %-d %Y" | upcase }}</span>
<h3>{{ post.title }}</h3>
<span class="plus" aria-hidden="true">+</span>
</a>
{% endfor %}
</div>
