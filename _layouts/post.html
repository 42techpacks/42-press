---
layout: default
---
<article>
<header class="post reveal">
<h1>{{ page.title }}</h1>
{% if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif %}
<div class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time><span>&middot;</span><span>{{ content | number_of_words | divided_by: 220 | plus: 1 }} min read</span></div>
</header>
{{ content }}
</article>
